version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ai-security-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports

  frontend:
    build: ./frontend/ai-security-firewall
    container_name: ai-security-frontend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000

    depends_on:
      - backend